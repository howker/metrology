name: infopoverka

description: client for Arshin API.

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <3.0.0"


dependencies:
  animated_splash_screen: ^1.2.0
  connectivity_plus: ^2.3.2
  cupertino_icons: ^1.0.2
  dio: ^4.0.6  
  flutter:
    sdk: flutter
  flutter_staggered_animations: ^1.0.0  
  flutter_svg: ^1.0.3
  flutter_typeahead: ^3.2.5   
  fluttertoast: ^8.0.9
    
  get_it: ^7.2.0
  hive: ^2.1.0
  hive_flutter: ^1.1.0  
  http: ^0.13.4
  intl: ^0.17.0
  json_annotation: ^4.4.0
  lottie: ^1.3.0
  mobile_scanner: ^1.1.0

  # open pdf document
  open_file: ^3.2.1

  # save file
  path_provider: ^2.0.10

  # create pdf document
  pdf: ^3.7.4

  provider: ^6.0.2   
  
  qr_flutter:
    git:
      url: https://github.com/theyakka/qr.flutter.git #and Rename QrImage to QrImageView  
  

  share_plus: ^4.0.4
  shimmer: ^2.0.0
  syncfusion_flutter_datepicker: ^19.4.56
  

dev_dependencies:
  build_runner: ^2.1.8
  flutter_launcher_icons: "^0.9.2"      
  flutter_lints: ^1.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.1.5
  surf_lint_rules: ^1.5.0
  

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true


flutter:  
  uses-material-design: true

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica.ttf 
  assets:
    - assets/animation/loading_balls.json
    - assets/animation/no_connection.json
    - assets/animation/loading_indicator.json
    - assets/images/QR_AppGallery.png
    - assets/images/appGalLogo.png
    