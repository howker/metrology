name: infopoverka

description: client for Arshin API.

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <3.0.0"


dependencies:     
  cupertino_icons: ^1.0.2
  dio: ^4.0.6  
  flutter:
    sdk: flutter  
  flutter_svg: ^1.0.3
  flutter_typeahead: ^3.2.5
  fluttertoast: ^8.0.9
  get_it: ^7.2.0  
  http: ^0.13.4
  intl: ^0.17.0
  json_annotation: ^4.4.0

  # save file
  path_provider: ^2.0.9

  # create pdf document
  pdf: ^3.7.4

  provider: ^6.0.2

  # qr gen & scan
  qr_code_scanner: ^0.7.0
  qr_flutter:
    git:
      url: https://github.com/theyakka/qr.flutter.git #and Rename QrImage to QrImageView
  
  

  share_plus: ^4.0.4
  shimmer: ^2.0.0
  syncfusion_flutter_datepicker: ^19.4.56
  

dev_dependencies:
  build_runner: ^2.1.8      
  flutter_lints: ^1.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.1.5
  surf_lint_rules: ^1.5.0


flutter:  
  uses-material-design: true

  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica.ttf  